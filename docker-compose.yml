services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: devsupport
      POSTGRES_USER: devsupport
      POSTGRES_PASSWORD: devsupport
    ports:
      - "${DEVSUPPORT_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsupport -d devsupport"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
