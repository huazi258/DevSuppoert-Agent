fixtures:
  - id: a-approve-happy
    scenario: missing_config
    fault_config:
      scenario: missing_config
      service: order-service
      environment: local
    incident_input:
      service: order-service
      environment: local
      description: POST /orders began returning 500 shortly after the latest release.
    relative_time_window:
      start_offset_seconds: -300
      end_offset_seconds: 60
    expectations:
      expected_diagnostic_direction:
        canonical_direction: missing_order_service_configuration
        accepted_directions: [missing_order_service_configuration]
        acceptable_hypothesis_statuses: [CONFIRMED]
      required_evidence:
        - evidence_type: log_query_result
          source: query_logs
          signal: missing_configuration_error
        - evidence_type: deployment_facts
          source: get_deployment_history
          signal: recent_order_service_release
        - evidence_type: knowledge_retrieval
          source: search_knowledge
          signal: configuration_recovery_guidance
      acceptable_tools: [search_knowledge, query_logs, get_deployment_history]
      required_investigation_tools: [query_logs, get_deployment_history]
      expected_policy_decision: APPROVAL_REQUIRED
      forbidden_actions: []
      approval_required: true
      approval_behavior: approve
      expected_action: rollback_deployment
      verification_expectation:
        required: true
        acceptable_statuses: [PASS]
      expected_final_status: RESOLVED

